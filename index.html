<!doctype html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IBM Bob Workshop — Smart IT Helpdesk Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f4; --tile:#ffffff; --border:#e0e0e0; --border2:#c6c6c6; --shell:#161616;
  --text:#161616; --text2:#525252; --text3:#6f6f6f;
  --blue:#0f62fe; --blue-hov:#0353e9;
  --ok:#24a148; --ok-bg:#defbe6; --info:#0043ce; --info-bg:#edf5ff;
  --warn-bg:#fcf4d6; --warn:#f1c21b; --err:#da1e28; --err-bg:#fff1f1;
  --tg-gray:#e0e0e0; --tg-blue-bg:#d0e2ff; --tg-blue:#0043ce;
  --tg-purp-bg:#e8daff; --tg-purp:#6929c4; --tg-teal-bg:#d9fbfb; --tg-teal:#005d5d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "IBM Plex Sans","IBM Plex Sans Thai",system-ui,sans-serif}
code,kbd{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.92em;background:#f4f4f4;padding:1px 6px;border:1px solid var(--border)}
a{color:var(--blue);text-decoration:none}


/* ===== Carbon UI shell header ===== */
.shell{position:sticky;top:0;z-index:50;height:48px;background:var(--shell);color:#fff;display:flex;align-items:center;padding:0 20px;gap:12px}
.shell b{font-weight:600}
.shell .sep{color:#525252}
.shell .grow{flex:1}
.shell .pill{font-size:12px;color:#c6c6c6;border:1px solid #393939;padding:2px 10px;display:inline-flex;gap:6px;align-items:center}


/* ===== layout ===== */
.page{display:flex;max-width:1280px;margin:0 auto}
.snav{width:248px;flex:none;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto;background:var(--tile);border-right:1px solid var(--border);padding:16px 0}
.snav .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:8px 20px 6px}
.snav a.nl{display:flex;gap:10px;align-items:center;padding:10px 20px;color:var(--text2);border-left:3px solid transparent;font-size:13px}
.snav a.nl:hover{background:#f4f4f4;color:var(--text)}
.snav a.nl.act{border-left-color:var(--blue);color:var(--text);background:#edf5ff;font-weight:600}
.snav a.nl .n{width:20px;height:20px;flex:none;border:1.5px solid var(--border2);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600}
.snav a.nl.act .n{border-color:var(--blue);background:var(--blue);color:#fff}
.legend{padding:8px 20px;display:flex;flex-direction:column;gap:6px}
main{flex:1;min-width:0;padding:0 32px 64px}


/* ===== journey stepper ===== */
.journey{background:var(--tile);border-bottom:1px solid var(--border);overflow-x:auto}
.journey .in{display:flex;min-width:720px;max-width:1280px;margin:0 auto;padding:14px 32px}
.jstep{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--text2)}
.jstep .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);background:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text2);z-index:1}
.jstep small{font-size:11px;color:var(--text3)}
.jstep .lb{font-size:12px;font-weight:600;color:var(--text)}
.jstep:not(:last-child)::after{content:"";position:absolute;top:12px;left:calc(50% + 16px);width:calc(100% - 32px);height:2px;background:var(--border)}
.jstep.hot .dot{border-color:var(--blue);background:var(--blue);color:#fff}


/* ===== hero ===== */
.hero{padding:40px 0 24px;border-bottom:1px solid var(--border)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:600}
h1{font-size:32px;line-height:1.2;margin:8px 0 10px;font-weight:600;letter-spacing:-.01em}
.hero p.sub{font-size:15px;color:var(--text2);max-width:720px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--tile);border:1px solid var(--border);border-top:3px solid var(--blue);margin-top:24px}
.stat{padding:18px 20px 16px}
.stat+.stat{border-left:1px solid var(--border)}
.stat .v{font-size:30px;font-weight:300;line-height:1.1;letter-spacing:-.01em}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-top:6px}


/* ===== generic tiles / sections ===== */
.blk{margin-top:32px}
h2.sec{font-size:20px;font-weight:600;margin:0 0 4px}
.sub2{color:var(--text2);font-size:13px;margin:0 0 16px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.cards3,.cards4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.cards3,.cards4{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stat+.stat{border-left:0;border-top:1px solid var(--border)}}
.mcard{background:var(--tile);border:1px solid var(--border);border-top:3px solid var(--blue);padding:16px}
.mcard.purp{border-top-color:#8a3ffc}.mcard.teal{border-top-color:#009d9a}
.mcard h4{margin:0 0 4px;font-size:15px}
.mcard p{margin:6px 0 0;font-size:13px;color:var(--text2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;background:#f4f4f4;border:1px solid var(--border);padding:2px 8px;font-family:"IBM Plex Mono",monospace}


/* tags */
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:2px;white-space:nowrap}
.tag.gray{background:var(--tg-gray);color:#161616}
.tag.blue{background:var(--tg-blue-bg);color:var(--tg-blue)}
.tag.purp{background:var(--tg-purp-bg);color:var(--tg-purp)}
.tag.teal{background:var(--tg-teal-bg);color:var(--tg-teal)}


/* notes = Carbon inline notifications */
.note{display:flex;gap:10px;padding:10px 14px;font-size:13px;border-left:3px solid;margin:10px 0;align-items:flex-start}
.note svg{flex:none;margin-top:1px}
.note b{font-weight:600}
.note.ok{background:var(--ok-bg);border-color:var(--ok)}
.note.info{background:var(--info-bg);border-color:var(--info)}
.note.warn{background:var(--warn-bg);border-color:var(--warn)}
.note.err{background:var(--err-bg);border-color:var(--err)}


/* ===== steps ===== */
.phase{margin-top:40px}
.phase-head{background:var(--tile);border:1px solid var(--border);padding:20px 24px}
.phase-meta{display:flex;gap:10px;align-items:center;font-size:12px;margin-bottom:6px}
.kicker{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.time{color:var(--text3);display:inline-flex;gap:5px;align-items:center}
.phase-head h3{font-size:20px;margin:0 0 4px}
.phase-head .ps{margin:0 0 12px;color:var(--text2);font-size:13px}
.step{display:flex;gap:16px;margin-top:16px}
.rail{display:flex;flex-direction:column;align-items:center}
.num{width:32px;height:32px;flex:none;background:#161616;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.rail .ln{flex:1;width:2px;background:var(--border2);margin-top:4px}
.step:last-child .rail .ln{display:none}
.sbody{flex:1;min-width:0;background:var(--tile);border:1px solid var(--border);padding:16px 20px 20px}
.shead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.shead h4{margin:0;font-size:15px;font-weight:600;flex:1;min-width:200px}


/* prompt card = Carbon code snippet */
.pcard{border:1px solid var(--border);margin-top:10px}
.pbar{display:flex;justify-content:flex-end;align-items:center;background:#f4f4f4;border-bottom:1px solid var(--border);padding:2px 8px}
.cbtn{border:1px solid transparent;background:transparent;color:var(--blue);font:600 12px "IBM Plex Sans",sans-serif;padding:3px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.cbtn:hover{background:#e8e8e8}
pre.prompt{display:none;margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font:13px/1.65 "IBM Plex Sans",sans-serif;color:#161616;background:#fff}
pre.prompt.show{display:block}
pre.code{margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 "IBM Plex Mono",ui-monospace,monospace;background:#fff;max-height:340px;overflow:auto}
.checkline{font-size:13px;margin-top:10px;color:var(--text2)}
.checkline b{color:var(--text)}


/* setup files */
.file-tile{background:var(--tile);border:1px solid var(--border)}
.file-tile .fh{display:flex;justify-content:space-between;align-items:center;background:#f4f4f4;border-bottom:1px solid var(--border);padding:8px 8px 8px 14px}
.file-tile .fh code{background:none;border:0;padding:0;font-weight:600;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}


/* accordion */
details.acc{background:var(--tile);border:1px solid var(--border);margin-top:12px}
details.acc summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;padding:14px 16px;font-weight:600;font-size:14px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{transition:transform .15s}
details.acc[open] summary .chev{transform:rotate(90deg)}
details.acc .accbody{border-top:1px solid var(--border)}


ul.tips{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--text)}
ul.tips li{margin-bottom:8px}


footer{margin-top:48px;padding:24px 0;border-top:1px solid var(--border);color:var(--text3);font-size:12px}


@media(max-width:1100px){.snav{display:none}main{padding:0 20px 64px}}
</style>
</head>
<body>


<!-- ===== Shell ===== -->
<header class="shell">
  <b>IBM Bob</b><span class="sep">|</span>
  <span>Smart IT Helpdesk Portal — Workshop Guide</span>
  <span class="grow"></span>
</header>


<!-- ===== Journey stepper ===== -->
<div class="journey"><div class="in">
  <a class="jstep" href="#setup"><span class="dot">0</span><span class="lb">Pre-flight</span><small>trainer</small></a>
  <a class="jstep" href="#ph1"><span class="dot">1</span><span class="lb">Security</span><small>default mode</small></a>
  <a class="jstep" href="#ph2"><span class="dot">2</span><span class="lb">Plan</span><small>default mode</small></a>
  <a class="jstep" href="#ph3"><span class="dot">3</span><span class="lb">Build</span><small>frontend</small></a>
  <a class="jstep" href="#ph4"><span class="dot">4</span><span class="lb">QA</span><small>default mode</small></a>
  <a class="jstep" href="#ph5"><span class="dot">5</span><span class="lb">Release</span><small>default mode</small></a>
</div></div>
